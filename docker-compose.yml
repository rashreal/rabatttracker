services:
  rabatttracker:
    build:
      context: .
      args:
        BASE_PATH: ""   # z.B. /rabatttracker — muss mit dem Reverse-Proxy-Pfad übereinstimmen
    container_name: rabatttracker
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - ./data:/app/data
